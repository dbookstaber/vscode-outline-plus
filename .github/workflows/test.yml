name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The VS Code test host and its downloaded marketplace extensions land in
      # the repo-local .vscode-test dir. Caching it keeps CI runs from
      # re-downloading VS Code + ~15 extensions every time.
      - name: Cache VS Code test host
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      # The Electron-based test host needs a display on Linux; xvfb-run supplies
      # a virtual one.
      - name: Run tests
        run: xvfb-run -a npm test
